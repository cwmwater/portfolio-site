<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="bdpArrow1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8fa3c4" />
    </marker>
    <marker id="bdpArrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="640" fill="#0b1220" />
  <text x="40" y="40" fill="#f6f4ef" font-size="20" font-weight="700">말씀결 자동 배포 — 테스트 통과 시에만, 정해진 순서로</text>

  <!-- 개발자 -->
  <rect x="40" y="90" width="150" height="90" rx="14" fill="#101a2c" stroke="#6b7280" stroke-width="1.5" />
  <text x="115" y="130" fill="#f6f4ef" font-size="13" font-weight="700" text-anchor="middle">개발자</text>
  <text x="115" y="154" fill="#9aa4b5" font-size="11" font-family="monospace" text-anchor="middle">git push</text>

  <!-- GitHub -->
  <rect x="230" y="90" width="220" height="90" rx="14" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1.5" />
  <image href="data:image/svg+xml;base64," x="327" y="106" width="26" height="26" />
  <text x="340" y="152" fill="#e5e5e5" font-size="14" font-weight="700" text-anchor="middle">GitHub</text>
  <text x="340" y="170" fill="#c7c7c7" font-size="10" text-anchor="middle">bible-name-lab</text>

  <!-- GitHub Actions CI -->
  <rect x="530" y="90" width="260" height="90" rx="14" fill="#1f2937" stroke="#64748b" stroke-width="1.5" />
  <image href="data:image/svg+xml;base64," x="647" y="106" width="26" height="26" />
  <text x="660" y="152" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">GitHub Actions (CI)</text>
  <text x="660" y="170" fill="#9aa4b5" font-size="10" text-anchor="middle">빌드 · 테스트</text>

  <!-- GitHub Actions CD -->
  <rect x="900" y="90" width="260" height="90" rx="14" fill="#1f2937" stroke="#64748b" stroke-width="1.5" />
  <image href="data:image/svg+xml;base64," x="1017" y="106" width="26" height="26" />
  <text x="1030" y="152" fill="#cbd5e1" font-size="13" font-weight="700" text-anchor="middle">GitHub Actions (CD)</text>
  <text x="1030" y="170" fill="#9aa4b5" font-size="10" text-anchor="middle">배포 워크플로 (workflow_run)</text>

  <line x1="190" y1="135" x2="228" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#bdpArrow2)" />
  <line x1="450" y1="135" x2="528" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#bdpArrow2)" />
  <text x="489" y="123" fill="#9aa4b5" font-size="10" text-anchor="middle">push</text>
  <line x1="790" y1="135" x2="898" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#bdpArrow1)" />
  <text x="844" y="118" fill="#e8b978" font-size="11" text-anchor="middle" font-weight="700">성공 시에만</text>

  <!-- 큐잉 note (CD 오른쪽, 수직 화살표와 안 겹치게) -->
  <rect x="1180" y="90" width="260" height="90" rx="10" fill="#1f1608" stroke="#d98e4c" stroke-width="1" stroke-dasharray="4 3" />
  <text x="1200" y="114" fill="#e8b978" font-size="11" font-weight="700">배포가 겹치면</text>
  <text x="1200" y="134" fill="#f0d9b8" font-size="11">취소하지 않고 순서대로</text>
  <text x="1200" y="154" fill="#f0d9b8" font-size="11">대기 (concurrency 큐잉)</text>

  <!-- CD -> VPS -->
  <line x1="1030" y1="180" x2="1030" y2="330" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#bdpArrow1)" />
  <text x="1015" y="260" fill="#9aa4b5" font-size="11" text-anchor="end">SSH 배포</text>
  <text x="1015" y="276" fill="#9aa4b5" font-size="11" text-anchor="end">스크립트 실행</text>

  <!-- VPS container -->
  <rect x="40" y="345" width="1420" height="215" rx="18" fill="#0f1729" stroke="#475569" stroke-width="1.5" />
  <text x="62" y="373" fill="#f6f4ef" font-size="14" font-weight="700">VPS — deploy-production.sh</text>

  <!-- steps -->
  <rect x="90" y="395" width="230" height="90" rx="12" fill="#101a2c" stroke="#9dbee0" stroke-width="1.5" />
  <text x="205" y="430" fill="#9dbee0" font-size="12" font-weight="700" text-anchor="middle">이미지 pull</text>
  <text x="205" y="448" fill="#c9d6e8" font-size="10" text-anchor="middle">GHCR에서</text>

  <line x1="320" y1="440" x2="360" y2="440" stroke="#8fa3c4" stroke-width="2" marker-end="url(#bdpArrow1)" />

  <rect x="360" y="395" width="270" height="90" rx="12" fill="#123a30" stroke="#7fe0c7" stroke-width="1.5" />
  <text x="495" y="425" fill="#7fe0c7" font-size="12" font-weight="700" text-anchor="middle">마이그레이션 · 시딩</text>
  <text x="495" y="443" fill="#cdeee3" font-size="10" text-anchor="middle">임시 컨테이너(run --rm)로</text>
  <text x="495" y="459" fill="#cdeee3" font-size="10" text-anchor="middle">먼저 완전히 끝냄</text>

  <line x1="630" y1="440" x2="670" y2="440" stroke="#8fa3c4" stroke-width="2" marker-end="url(#bdpArrow1)" />

  <rect x="670" y="395" width="230" height="90" rx="12" fill="#101a2c" stroke="#9dbee0" stroke-width="1.5" />
  <text x="785" y="430" fill="#9dbee0" font-size="12" font-weight="700" text-anchor="middle">컨테이너 교체</text>
  <text x="785" y="448" fill="#c9d6e8" font-size="10" text-anchor="middle">up -d</text>

  <line x1="900" y1="440" x2="940" y2="440" stroke="#8fa3c4" stroke-width="2" marker-end="url(#bdpArrow1)" />

  <rect x="940" y="395" width="210" height="90" rx="12" fill="#101a2c" stroke="#9dbee0" stroke-width="1.5" />
  <text x="1045" y="430" fill="#9dbee0" font-size="12" font-weight="700" text-anchor="middle">헬스체크</text>
  <text x="1045" y="448" fill="#c9d6e8" font-size="10" text-anchor="middle">5초 간격 재시도</text>

  <line x1="1150" y1="440" x2="1190" y2="440" stroke="#8fa3c4" stroke-width="2" marker-end="url(#bdpArrow1)" />

  <!-- Discord 알림 -->
  <rect x="1190" y="395" width="200" height="90" rx="12" fill="#101a2c" stroke="#9dbee0" stroke-width="1.5" />
  <text x="1290" y="435" fill="#9dbee0" font-size="12" font-weight="700" text-anchor="middle">Discord 알림</text>
  <text x="1290" y="453" fill="#c9d6e8" font-size="10" text-anchor="middle">웹훅으로 결과 전송</text>

  <!-- 순서 고정 note -->
  <rect x="360" y="500" width="540" height="40" rx="8" fill="#1f1608" stroke="#d98e4c" stroke-width="1" stroke-dasharray="4 3" />
  <text x="380" y="525" fill="#f0d9b8" font-size="11">마이그레이션·시딩이 끝난 뒤에만 교체 — 순서가 바뀌면 새 코드가 구스키마에 붙는 창 발생</text>
</svg>
