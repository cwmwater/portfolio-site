<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 440" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="arrowSteel" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6f93c4" />
    </marker>
    <marker id="arrowCopper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d98e4c" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="440" fill="#0b1220" />
  <text x="30" y="36" fill="#f6f4ef" font-size="18" font-weight="700">트레이딩 봇 — 시세 수집부터 매매 실행까지</text>

  <!-- Row 1 -->
  <rect x="30" y="60" width="220" height="90" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="140" y="98" fill="#9dbee0" font-size="14" font-weight="700" text-anchor="middle">거래소 API</text>
  <text x="140" y="118" fill="#c9d6e8" font-size="10" text-anchor="middle">시세 조회</text>

  <rect x="270" y="60" width="220" height="90" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="380" y="98" fill="#9dbee0" font-size="14" font-weight="700" text-anchor="middle">시세 수집</text>
  <text x="380" y="118" fill="#c9d6e8" font-size="10" text-anchor="middle">일괄 조회로 요청 절감</text>

  <rect x="510" y="60" width="220" height="90" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="620" y="98" fill="#9dbee0" font-size="14" font-weight="700" text-anchor="middle">지표 계산</text>
  <text x="620" y="118" fill="#c9d6e8" font-size="10" text-anchor="middle">MA·ADX·RSI·ATR·볼린저밴드</text>

  <rect x="750" y="60" width="220" height="90" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="860" y="98" fill="#9dbee0" font-size="14" font-weight="700" text-anchor="middle">패턴 감지·스코어링</text>
  <text x="860" y="118" fill="#c9d6e8" font-size="10" text-anchor="middle">11개 패턴 → 0~100점</text>

  <line x1="250" y1="105" x2="268" y2="105" stroke="#6f93c4" stroke-width="2" marker-end="url(#arrowSteel)" />
  <line x1="490" y1="105" x2="508" y2="105" stroke="#6f93c4" stroke-width="2" marker-end="url(#arrowSteel)" />
  <line x1="730" y1="105" x2="748" y2="105" stroke="#6f93c4" stroke-width="2" marker-end="url(#arrowSteel)" />

  <!-- Elbow connector row1 -> row2 -->
  <line x1="860" y1="150" x2="860" y2="180" stroke="#6f93c4" stroke-width="2" />
  <line x1="860" y1="180" x2="140" y2="180" stroke="#6f93c4" stroke-width="2" />
  <line x1="140" y1="180" x2="140" y2="208" stroke="#6f93c4" stroke-width="2" marker-end="url(#arrowSteel)" />

  <!-- Row 2 -->
  <rect x="30" y="210" width="220" height="90" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="140" y="248" fill="#9dbee0" font-size="14" font-weight="700" text-anchor="middle">다중 조건 판단</text>
  <text x="140" y="268" fill="#c9d6e8" font-size="10" text-anchor="middle">지표 동시 충족 시만 진입</text>

  <rect x="270" y="210" width="220" height="90" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="380" y="248" fill="#9dbee0" font-size="14" font-weight="700" text-anchor="middle">리스크 관리</text>
  <text x="380" y="268" fill="#c9d6e8" font-size="10" text-anchor="middle">ATR 손절·익절, 트레일링스탑</text>

  <rect x="510" y="210" width="220" height="90" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="620" y="248" fill="#9dbee0" font-size="14" font-weight="700" text-anchor="middle">주문 실행</text>
  <text x="620" y="268" fill="#c9d6e8" font-size="10" text-anchor="middle">멀티 포지션(슬롯 분배)</text>

  <rect x="750" y="210" width="220" height="90" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="860" y="248" fill="#9dbee0" font-size="14" font-weight="700" text-anchor="middle">Discord 알림</text>
  <text x="860" y="268" fill="#c9d6e8" font-size="10" text-anchor="middle">시황 코멘트 자동 생성</text>

  <line x1="250" y1="255" x2="268" y2="255" stroke="#6f93c4" stroke-width="2" marker-end="url(#arrowSteel)" />
  <line x1="490" y1="255" x2="508" y2="255" stroke="#6f93c4" stroke-width="2" marker-end="url(#arrowSteel)" />
  <line x1="730" y1="255" x2="748" y2="255" stroke="#6f93c4" stroke-width="2" marker-end="url(#arrowSteel)" />

  <!-- Resilience note -->
  <line x1="620" y1="300" x2="620" y2="328" stroke="#d98e4c" stroke-width="2" marker-end="url(#arrowCopper)" />

  <rect x="420" y="330" width="400" height="70" rx="14" fill="#4a3218" stroke="#d98e4c" stroke-width="1.5" />
  <text x="620" y="360" fill="#e8b978" font-size="13" font-weight="700" text-anchor="middle">포지션 동기화</text>
  <text x="620" y="378" fill="#f0d9b8" font-size="10" text-anchor="middle">재시작 시 거래소 잔고를 스캔해 로컬 상태와 자동 복구</text>
</svg>
