<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="arrowC1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8fa3c4" />
    </marker>
    <marker id="arrowC2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#0b1220" />
  <text x="40" y="40" fill="#f6f4ef" font-size="20" font-weight="700">마케튼 CI/CD — 저장소별 배포 자동화</text>

  <!-- 개발자 -->
  <rect x="40" y="90" width="150" height="90" rx="14" fill="#101a2c" stroke="#6b7280" stroke-width="1.5" />
  <text x="115" y="130" fill="#f6f4ef" font-size="13" font-weight="700" text-anchor="middle">개발자</text>
  <text x="115" y="154" fill="#9aa4b5" font-size="11" font-family="monospace" text-anchor="middle">git push</text>

  <!-- GitHub -->
  <rect x="270" y="90" width="230" height="90" rx="14" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1.5" />
  <image href="data:image/svg+xml;base64," x="372" y="106" width="26" height="26" />
  <text x="385" y="152" fill="#e5e5e5" font-size="14" font-weight="700" text-anchor="middle">GitHub</text>
  <text x="385" y="170" fill="#c7c7c7" font-size="10" text-anchor="middle">backend · fastapi-module · frontend</text>

  <!-- GitHub Actions -->
  <rect x="580" y="90" width="230" height="90" rx="14" fill="#1f2937" stroke="#64748b" stroke-width="1.5" />
  <image href="data:image/svg+xml;base64," x="682" y="106" width="26" height="26" />
  <text x="695" y="152" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">GitHub Actions</text>
  <text x="695" y="170" fill="#9aa4b5" font-size="10" text-anchor="middle">저장소별 워크플로우 · 이미지 빌드</text>

  <!-- GHCR -->
  <rect x="890" y="90" width="230" height="90" rx="14" fill="#1f2937" stroke="#64748b" stroke-width="1.5" />
  <image href="data:image/svg+xml;base64," x="992" y="106" width="26" height="26" />
  <text x="1005" y="152" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">GHCR</text>
  <text x="1005" y="170" fill="#9aa4b5" font-size="10" text-anchor="middle">이미지 레지스트리</text>

  <line x1="190" y1="135" x2="268" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowC2)" />
  <line x1="500" y1="135" x2="578" y2="135" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowC2)" />
  <text x="539" y="123" fill="#9aa4b5" font-size="10" text-anchor="middle">push</text>
  <line x1="810" y1="135" x2="888" y2="135" stroke="#64748b" stroke-width="2" marker-end="url(#arrowC1)" />
  <text x="849" y="123" fill="#9aa4b5" font-size="10" text-anchor="middle">build &amp; push</text>

  <!-- frontend 전용 콜아웃 -->
  <rect x="580" y="200" width="230" height="46" rx="10" fill="#1f1608" stroke="#d98e4c" stroke-width="1" stroke-dasharray="4 3" />
  <text x="695" y="220" fill="#e8b978" font-size="11" text-anchor="middle" font-weight="700">frontend 워크플로우만</text>
  <text x="695" y="237" fill="#f0d9b8" font-size="10" text-anchor="middle">빌드 시점에 API 주소 주입</text>

  <!-- SSH 배포 -->
  <line x1="1005" y1="180" x2="1005" y2="290" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowC1)" />
  <text x="1050" y="240" fill="#9aa4b5" font-size="11" text-anchor="middle">SSH 배포</text>
  <text x="1050" y="256" fill="#9aa4b5" font-size="11" text-anchor="middle">pull</text>

  <!-- VPS -->
  <rect x="150" y="290" width="900" height="180" rx="18" fill="#0f1729" stroke="#475569" stroke-width="1.5" />
  <text x="172" y="318" fill="#f6f4ef" font-size="14" font-weight="700">Oracle Cloud VPS</text>

  <rect x="185" y="345" width="230" height="95" rx="12" fill="#101a2c" stroke="#9dbee0" stroke-width="1.5" />
  <text x="300" y="380" fill="#9dbee0" font-size="13" font-weight="700" text-anchor="middle">frontend 컨테이너</text>
  <text x="300" y="400" fill="#c9d6e8" font-size="10" text-anchor="middle">변경 시에만 재실행</text>

  <rect x="445" y="345" width="230" height="95" rx="12" fill="#123a30" stroke="#7fe0c7" stroke-width="1.5" />
  <text x="560" y="380" fill="#7fe0c7" font-size="13" font-weight="700" text-anchor="middle">backend 컨테이너</text>
  <text x="560" y="400" fill="#cdeee3" font-size="10" text-anchor="middle">변경 시에만 재실행</text>

  <rect x="705" y="345" width="230" height="95" rx="12" fill="#4a3218" stroke="#e8b978" stroke-width="1.5" />
  <text x="820" y="380" fill="#e8b978" font-size="13" font-weight="700" text-anchor="middle">fastapi-module 컨테이너</text>
  <text x="820" y="400" fill="#f0d9b8" font-size="10" text-anchor="middle">변경 시에만 재실행</text>

  <!-- 하단 note -->
  <rect x="150" y="495" width="900" height="55" rx="10" fill="#1a1a2e" stroke="#6f93c4" stroke-width="1" stroke-dasharray="4 3" />
  <text x="170" y="528" fill="#9dbee0" font-size="12">3개 저장소는 서비스별로 독립 배포 — 변경된 저장소의 이미지만 pull해 해당 컨테이너만 재실행하고, 바뀌지 않은 서비스는 재시작 없이 계속 유지됨</text>
</svg>
