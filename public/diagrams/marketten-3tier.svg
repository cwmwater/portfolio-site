<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1fbf9b" />
    </marker>
    <marker id="arrowMuted" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="560" fill="#0b1220" />

  <!-- Title -->
  <text x="30" y="42" fill="#f6f4ef" font-size="20" font-weight="700">3계층 아키텍처 — React ↔ Spring Boot ↔ FastAPI</text>

  <!-- Boxes -->
  <!-- React -->
  <rect x="30" y="180" width="190" height="110" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="125" y="222" fill="#9dbee0" font-size="16" font-weight="700" text-anchor="middle">React</text>
  <text x="125" y="244" fill="#c9d6e8" font-size="12" text-anchor="middle">프론트엔드</text>
  <text x="125" y="264" fill="#c9d6e8" font-size="11" text-anchor="middle">단계별 글 생성 UI</text>

  <!-- Spring Boot -->
  <rect x="290" y="180" width="220" height="110" rx="14" fill="#123a30" stroke="#1fbf9b" stroke-width="1.5" />
  <text x="400" y="212" fill="#7fe0c7" font-size="16" font-weight="700" text-anchor="middle">Spring Boot</text>
  <text x="400" y="234" fill="#cdeee3" font-size="12" text-anchor="middle">인증(OAuth2/JWT) · DB · 비즈니스 로직</text>
  <text x="400" y="252" fill="#cdeee3" font-size="12" text-anchor="middle">FastAPI 호출용 전용 클라이언트</text>
  <text x="400" y="272" fill="#89c9b6" font-size="11" text-anchor="middle">(RestTemplate)</text>

  <!-- FastAPI -->
  <rect x="580" y="180" width="220" height="110" rx="14" fill="#4a3218" stroke="#d98e4c" stroke-width="1.5" />
  <text x="690" y="212" fill="#e8b978" font-size="16" font-weight="700" text-anchor="middle">FastAPI</text>
  <text x="690" y="234" fill="#f0d9b8" font-size="12" text-anchor="middle">GPT API 연동 · RAG 예문 검색</text>
  <text x="690" y="252" fill="#f0d9b8" font-size="12" text-anchor="middle">키워드 · 본문 · 제목 생성 로직</text>
  <text x="690" y="272" fill="#d9b98c" font-size="11" text-anchor="middle">(Python)</text>

  <!-- OpenAI -->
  <rect x="860" y="185" width="150" height="100" rx="14" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1.5" />
  <text x="935" y="222" fill="#e5e5e5" font-size="14" font-weight="700" text-anchor="middle">OpenAI</text>
  <text x="935" y="242" fill="#c7c7c7" font-size="12" text-anchor="middle">GPT API</text>

  <!-- Request arrows (top) -->
  <line x1="220" y1="205" x2="288" y2="205" stroke="#1fbf9b" stroke-width="2" marker-end="url(#arrowTeal)" />
  <text x="254" y="198" fill="#9aa4b5" font-size="11" text-anchor="middle">요청</text>

  <line x1="510" y1="205" x2="578" y2="205" stroke="#1fbf9b" stroke-width="2" marker-end="url(#arrowTeal)" />
  <text x="544" y="198" fill="#9aa4b5" font-size="11" text-anchor="middle">요청</text>

  <line x1="800" y1="215" x2="858" y2="215" stroke="#1fbf9b" stroke-width="2" marker-end="url(#arrowTeal)" />
  <text x="829" y="208" fill="#9aa4b5" font-size="11" text-anchor="middle">호출</text>

  <!-- Response arrows (bottom) -->
  <line x1="288" y1="255" x2="220" y2="255" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowMuted)" />
  <text x="254" y="270" fill="#9aa4b5" font-size="11" text-anchor="middle">응답</text>

  <line x1="578" y1="255" x2="510" y2="255" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowMuted)" />
  <text x="544" y="270" fill="#9aa4b5" font-size="11" text-anchor="middle">응답</text>

  <line x1="858" y1="255" x2="800" y2="255" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowMuted)" />
  <text x="829" y="270" fill="#9aa4b5" font-size="11" text-anchor="middle">응답</text>

  <!-- Contract callout -->
  <rect x="290" y="310" width="510" height="46" rx="10" fill="#132018" stroke="#1fbf9b" stroke-width="1" stroke-dasharray="4 3" />
  <text x="545" y="330" fill="#7fe0c7" font-size="12" font-weight="700" text-anchor="middle">Spring ↔ FastAPI 공통 응답 계약</text>
  <text x="545" y="347" fill="#cdeee3" font-size="12" font-family="monospace" text-anchor="middle">{ "success": bool, "data": ..., "error": ... }</text>

  <!-- Why FastAPI box -->
  <rect x="30" y="390" width="980" height="150" rx="14" fill="#101a2c" stroke="#2a3b57" stroke-width="1" />
  <text x="52" y="420" fill="#f6f4ef" font-size="15" font-weight="700">왜 Spring 안에서 GPT를 직접 호출하지 않고 FastAPI를 따로 뒀나</text>

  <text x="52" y="448" fill="#c9d6e8" font-size="13">1. AI 생태계 — OpenAI SDK, 임베딩·코사인 유사도 계산(RAG)이 Python 쪽 라이브러리가 압도적으로 풍부하고 간결함</text>
  <text x="52" y="472" fill="#c9d6e8" font-size="13">2. 관심사 분리 — Spring은 인증·DB·비즈니스 로직에 집중, FastAPI는 GPT 프롬프트 설계·AI 응답 처리에만 집중</text>
  <text x="52" y="496" fill="#c9d6e8" font-size="13">3. 병렬 개발 — 팀 내에서 백엔드(Spring)와 AI 연동(FastAPI) 작업을 서로 다른 사람이 동시에 진행할 수 있었음</text>
  <text x="52" y="520" fill="#c9d6e8" font-size="13">4. 장애 격리 — GPT API 응답 지연·오류가 FastAPI 선에서 처리되어 Spring 쪽 핵심 기능(로그인, DB)에 영향을 주지 않음</text>
</svg>
