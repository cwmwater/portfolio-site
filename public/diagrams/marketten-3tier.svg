<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 620" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="arrowReq" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8fa3c4" />
    </marker>
    <marker id="arrowRes" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#e8b978" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="620" fill="#0b1220" />
  <text x="40" y="40" fill="#f6f4ef" font-size="20" font-weight="700">마케튼 3계층 아키텍처 — 요청부터 AI 응답까지</text>

  <!-- 사용자 -->
  <g stroke="#e8ecf3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="264" r="16" />
    <path d="M30,312 a30,26 0 0 1 60,0" />
  </g>
  <text x="60" y="345" fill="#e8ecf3" font-size="14" font-weight="700" text-anchor="middle">사용자</text>

  <!-- 사용자 <-> React -->
  <line x1="108" y1="250" x2="188" y2="250" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowReq)" />
  <text x="148" y="238" fill="#8fa3c4" font-size="11" text-anchor="middle">요청 전송</text>
  <line x1="188" y1="320" x2="108" y2="320" stroke="#e8b978" stroke-width="2" marker-end="url(#arrowRes)" />
  <text x="148" y="340" fill="#e8b978" font-size="11" text-anchor="middle">결과 표시</text>

  <!-- 마케튼 서비스 경계 -->
  <rect x="190" y="170" width="980" height="290" rx="16" fill="none" stroke="#6f93c4" stroke-width="1.5" stroke-dasharray="5 4" />
  <text x="208" y="194" fill="#9dbee0" font-size="12" font-weight="700">마케튼 서비스</text>

  <!-- React -->
  <rect x="215" y="215" width="280" height="140" rx="14" fill="#12233d" stroke="#9dbee0" stroke-width="2" />
  <image href="data:image/svg+xml;base64," x="339" y="230" width="32" height="32" />
  <text x="355" y="292" fill="#9dbee0" font-size="15" font-weight="700" text-anchor="middle">React</text>
  <text x="355" y="312" fill="#c9d6e8" font-size="11" text-anchor="middle">화면 렌더링 · 요청 전송</text>

  <!-- Spring Boot -->
  <rect x="545" y="215" width="280" height="140" rx="14" fill="#123a30" stroke="#7fe0c7" stroke-width="2" />
  <image href="data:image/svg+xml;base64," x="669" y="230" width="32" height="32" />
  <text x="685" y="292" fill="#7fe0c7" font-size="15" font-weight="700" text-anchor="middle">Spring Boot</text>
  <text x="685" y="312" fill="#cdeee3" font-size="11" text-anchor="middle">인증 · 요청 정리 · 라우팅</text>

  <!-- FastAPI -->
  <rect x="875" y="215" width="280" height="140" rx="14" fill="#4a3218" stroke="#e8b978" stroke-width="2" />
  <image href="data:image/svg+xml;base64," x="999" y="230" width="32" height="32" />
  <text x="1015" y="292" fill="#e8b978" font-size="15" font-weight="700" text-anchor="middle">FastAPI</text>
  <text x="1015" y="312" fill="#f0d9b8" font-size="11" text-anchor="middle">프롬프트 구성 · OpenAI 호출</text>

  <!-- React <-> Spring Boot -->
  <line x1="495" y1="250" x2="545" y2="250" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowReq)" />
  <text x="520" y="238" fill="#8fa3c4" font-size="11" text-anchor="middle">요청</text>
  <line x1="545" y1="320" x2="495" y2="320" stroke="#e8b978" stroke-width="2" marker-end="url(#arrowRes)" />
  <text x="520" y="340" fill="#e8b978" font-size="11" text-anchor="middle">응답</text>

  <!-- Spring Boot <-> FastAPI -->
  <line x1="825" y1="250" x2="875" y2="250" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowReq)" />
  <text x="850" y="238" fill="#8fa3c4" font-size="11" text-anchor="middle">요청</text>
  <line x1="875" y1="320" x2="825" y2="320" stroke="#e8b978" stroke-width="2" marker-end="url(#arrowRes)" />
  <text x="850" y="340" fill="#e8b978" font-size="11" text-anchor="middle">응답</text>

  <!-- Spring Boot -> MySQL / Redis -->
  <line x1="600" y1="355" x2="600" y2="390" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowReq)" />
  <line x1="770" y1="355" x2="770" y2="390" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowReq)" />

  <rect x="525" y="390" width="150" height="70" rx="12" fill="#241a33" stroke="#a78bda" stroke-width="1.5" />
  <text x="600" y="422" fill="#d9c9f0" font-size="13" font-weight="700" text-anchor="middle">MySQL</text>
  <text x="600" y="440" fill="#c3aee0" font-size="10" text-anchor="middle">데이터 저장</text>

  <rect x="695" y="390" width="150" height="70" rx="12" fill="#241a33" stroke="#a78bda" stroke-width="1.5" />
  <text x="770" y="422" fill="#d9c9f0" font-size="13" font-weight="700" text-anchor="middle">Redis</text>
  <text x="770" y="440" fill="#c3aee0" font-size="10" text-anchor="middle">세션 저장</text>

  <!-- FastAPI <-> OpenAI -->
  <line x1="1155" y1="250" x2="1215" y2="250" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowReq)" />
  <text x="1185" y="238" fill="#8fa3c4" font-size="11" text-anchor="middle">GPT 호출</text>
  <line x1="1215" y1="320" x2="1155" y2="320" stroke="#e8b978" stroke-width="2" marker-end="url(#arrowRes)" />
  <text x="1185" y="340" fill="#e8b978" font-size="11" text-anchor="middle">응답</text>

  <!-- OpenAI (외부 서비스) -->
  <rect x="1220" y="215" width="220" height="140" rx="14" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1.5" />
  <text x="1330" y="280" fill="#e5e5e5" font-size="15" font-weight="700" text-anchor="middle">OpenAI</text>
  <text x="1330" y="300" fill="#c7c7c7" font-size="11" text-anchor="middle">GPT API</text>
</svg>
