<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="arrowTeal2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1fbf9b" />
    </marker>
    <marker id="arrowCopper" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d98e4c" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="640" fill="#0b1220" />

  <text x="30" y="42" fill="#f6f4ef" font-size="20" font-weight="700">RAG 구조 — 예문 등록 시점 vs 글 생성 요청 시점</text>

  <!-- Row A: 등록 흐름 -->
  <text x="30" y="90" fill="#7fe0c7" font-size="14" font-weight="700">① 예문 등록 시 (관리자가 톤별 예문 추가)</text>

  <rect x="30" y="110" width="170" height="80" rx="12" fill="#123a30" stroke="#1fbf9b" stroke-width="1.5" />
  <text x="115" y="145" fill="#e6fbf4" font-size="13" text-anchor="middle">예문 텍스트</text>
  <text x="115" y="164" fill="#89c9b6" font-size="11" text-anchor="middle">(톤 태그 포함)</text>

  <line x1="200" y1="150" x2="258" y2="150" stroke="#1fbf9b" stroke-width="2" marker-end="url(#arrowTeal2)" />

  <rect x="260" y="110" width="200" height="80" rx="12" fill="#101a2c" stroke="#6f93c4" stroke-width="1.5" />
  <text x="360" y="145" fill="#cfe0f5" font-size="13" text-anchor="middle">OpenAI 임베딩 API</text>
  <text x="360" y="164" fill="#9dbee0" font-size="11" text-anchor="middle">text-embedding-3-small</text>

  <line x1="460" y1="150" x2="518" y2="150" stroke="#1fbf9b" stroke-width="2" marker-end="url(#arrowTeal2)" />

  <rect x="520" y="110" width="220" height="80" rx="12" fill="#123a30" stroke="#1fbf9b" stroke-width="1.5" />
  <text x="630" y="140" fill="#e6fbf4" font-size="13" text-anchor="middle">임베딩 벡터를</text>
  <text x="630" y="160" fill="#e6fbf4" font-size="13" text-anchor="middle">예문 테이블에 그대로 저장</text>
  <text x="630" y="178" fill="#89c9b6" font-size="11" text-anchor="middle">(별도 벡터DB 없음)</text>

  <!-- Row B: 생성 요청 흐름 -->
  <text x="30" y="250" fill="#e8b978" font-size="14" font-weight="700">② 글 생성 요청 시 (사용자가 상품 정보 입력)</text>

  <rect x="30" y="270" width="200" height="80" rx="12" fill="#4a3218" stroke="#d98e4c" stroke-width="1.5" />
  <text x="130" y="305" fill="#f6e6d2" font-size="13" text-anchor="middle">상품 정보 · 키워드</text>
  <text x="130" y="324" fill="#d9b98c" font-size="11" text-anchor="middle">요청 내용</text>

  <line x1="230" y1="310" x2="288" y2="310" stroke="#d98e4c" stroke-width="2" marker-end="url(#arrowCopper)" />

  <rect x="290" y="270" width="200" height="80" rx="12" fill="#101a2c" stroke="#6f93c4" stroke-width="1.5" />
  <text x="390" y="305" fill="#cfe0f5" font-size="13" text-anchor="middle">요청 내용 임베딩 계산</text>
  <text x="390" y="324" fill="#9dbee0" font-size="11" text-anchor="middle">(동일 임베딩 API)</text>

  <line x1="490" y1="310" x2="548" y2="310" stroke="#d98e4c" stroke-width="2" marker-end="url(#arrowCopper)" />

  <rect x="550" y="270" width="230" height="80" rx="12" fill="#4a3218" stroke="#d98e4c" stroke-width="1.5" />
  <text x="665" y="300" fill="#f6e6d2" font-size="13" text-anchor="middle">저장된 예문들과</text>
  <text x="665" y="320" fill="#f6e6d2" font-size="13" text-anchor="middle">코사인 유사도 비교</text>
  <text x="665" y="338" fill="#d9b98c" font-size="11" text-anchor="middle">(순수 Python 계산)</text>

  <line x1="780" y1="310" x2="838" y2="310" stroke="#d98e4c" stroke-width="2" marker-end="url(#arrowCopper)" />

  <rect x="840" y="270" width="170" height="80" rx="12" fill="#123a30" stroke="#1fbf9b" stroke-width="1.5" />
  <text x="925" y="305" fill="#e6fbf4" font-size="13" text-anchor="middle">가장 유사한 예문</text>
  <text x="925" y="324" fill="#89c9b6" font-size="11" text-anchor="middle">프롬프트에 삽입 → GPT 호출</text>

  <!-- 검증 결과 -->
  <rect x="30" y="390" width="980" height="90" rx="14" fill="#132018" stroke="#1fbf9b" stroke-width="1" stroke-dasharray="4 3" />
  <text x="52" y="418" fill="#7fe0c7" font-size="13" font-weight="700">검증 결과 (서로 다른 주제의 예문 3개로 테스트)</text>
  <text x="52" y="442" fill="#cdeee3" font-size="13">관련 있는 예문의 코사인 유사도: 0.33</text>
  <text x="52" y="464" fill="#cdeee3" font-size="13">무관한 예문의 코사인 유사도: 0.19 ~ 0.24  → 두 그룹이 명확하게 구분됨을 확인</text>

  <!-- Why no vector DB box -->
  <rect x="30" y="500" width="980" height="120" rx="14" fill="#101a2c" stroke="#2a3b57" stroke-width="1" />
  <text x="52" y="530" fill="#f6f4ef" font-size="15" font-weight="700">왜 별도 벡터DB(Pinecone, Milvus 등) 없이 구현했나</text>
  <text x="52" y="558" fill="#c9d6e8" font-size="13">1. 인프라 제약 — 배포 서버가 RAM 1GB짜리 VPS라 별도 벡터DB를 띄울 여유가 없었음</text>
  <text x="52" y="582" fill="#c9d6e8" font-size="13">2. 규모 — 예문 수가 수십~수백 개 수준이라, 저장해둔 임베딩을 순회하며 코사인 유사도를 계산해도 충분히 빠름</text>
  <text x="52" y="606" fill="#c9d6e8" font-size="13">3. 결과 — 벡터DB 없이도 관련/무관 예문의 유사도가 뚜렷이 갈려(0.33 vs 0.19~0.24), 검색 품질을 확보함</text>
</svg>
