<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="arrowSolid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8fa3c4" />
    </marker>
    <marker id="arrowDash" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6b8c" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="720" fill="#0b1220" />
  <text x="40" y="44" fill="#f6f4ef" font-size="20" font-weight="700">마케튼 RAG 구조 — 예문 등록부터 톤 맞춤 생성까지</text>

  <!-- ===== Icons ===== -->
  <!-- 관리자 (person) -->
  <g stroke="#e8ecf3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="150" cy="180" r="16" />
    <path d="M120,232 a30,26 0 0 1 60,0" />
  </g>
  <text x="150" y="270" fill="#e8ecf3" font-size="15" font-weight="700" text-anchor="middle">관리자</text>

  <!-- 예문 저장소 (document stack / DB) -->
  <g stroke="#7fe0c7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="650" y="150" width="50" height="62" rx="6" transform="translate(8,8)" opacity="0.5" />
    <rect x="650" y="150" width="50" height="62" rx="6" />
    <line x1="662" y1="168" x2="688" y2="168" />
    <line x1="662" y1="180" x2="688" y2="180" />
    <line x1="662" y1="192" x2="678" y2="192" />
  </g>
  <text x="705" y="248" fill="#7fe0c7" font-size="15" font-weight="700" text-anchor="start">예문 저장소</text>
  <text x="705" y="268" fill="#89c9b6" font-size="11" text-anchor="start">MySQL JSON 컬럼</text>
  <text x="705" y="284" fill="#89c9b6" font-size="11" text-anchor="start">(별도 벡터DB 없음)</text>

  <!-- GPT (AI chip) -->
  <g stroke="#e8b978" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1180" y="150" width="60" height="60" rx="10" />
    <line x1="1195" y1="150" x2="1195" y2="138" />
    <line x1="1225" y1="150" x2="1225" y2="138" />
    <line x1="1195" y1="210" x2="1195" y2="222" />
    <line x1="1225" y1="210" x2="1225" y2="222" />
    <line x1="1180" y1="165" x2="1168" y2="165" />
    <line x1="1180" y1="195" x2="1168" y2="195" />
    <line x1="1240" y1="165" x2="1252" y2="165" />
    <line x1="1240" y1="195" x2="1252" y2="195" />
  </g>
  <text x="1210" y="196" fill="#e8b978" font-size="13" font-weight="700" text-anchor="middle">GPT</text>
  <text x="1210" y="248" fill="#e8b978" font-size="15" font-weight="700" text-anchor="middle">본문 생성</text>

  <!-- 사용자 (person) -->
  <g stroke="#e8ecf3" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="150" cy="540" r="16" />
    <path d="M120,592 a30,26 0 0 1 60,0" />
  </g>
  <text x="150" y="630" fill="#e8ecf3" font-size="15" font-weight="700" text-anchor="middle">사용자</text>

  <!-- 유사도 검색 (magnifier + doc) -->
  <g stroke="#9dbee0" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="655" y="508" width="46" height="58" rx="6" />
    <line x1="666" y1="524" x2="690" y2="524" />
    <line x1="666" y1="536" x2="690" y2="536" />
    <circle cx="705" cy="552" r="13" fill="#0b1220" />
    <line x1="714" y1="561" x2="724" y2="571" />
  </g>
  <text x="683" y="606" fill="#9dbee0" font-size="15" font-weight="700" text-anchor="middle">유사도 검색</text>
  <text x="683" y="626" fill="#8fb0d6" font-size="11" text-anchor="middle">FastAPI · 코사인 유사도 직접 계산</text>

  <!-- ===== Arrows ===== -->
  <!-- 관리자 -> 예문저장소 (prep, dashed) -->
  <line x1="192" y1="180" x2="638" y2="180" stroke="#5b6b8c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowDash)" />
  <rect x="230" y="150" width="370" height="30" fill="#0b1220" />
  <text x="415" y="169" fill="#9aa4b5" font-size="12" text-anchor="middle">예문 등록 → 임베딩(텍스트→벡터 변환) 계산 → 저장</text>

  <!-- 사용자 -> 유사도검색 -->
  <line x1="192" y1="540" x2="638" y2="540" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowSolid)" />
  <rect x="310" y="524" width="210" height="30" fill="#0b1220" />
  <text x="415" y="543" fill="#cdd7ea" font-size="12" text-anchor="middle">질의 (상품 정보 · 키워드)</text>

  <!-- 유사도검색 <-> 예문저장소 -->
  <line x1="683" y1="500" x2="683" y2="222" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowSolid)" />
  <rect x="670" y="345" width="180" height="48" fill="#0b1220" />
  <text x="683" y="364" fill="#cdd7ea" font-size="12" text-anchor="middle">검색</text>
  <text x="683" y="382" fill="#cdd7ea" font-size="12" text-anchor="middle">(임베딩 유사도 비교)</text>

  <!-- 예문저장소 -> GPT -->
  <line x1="722" y1="180" x2="1168" y2="180" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowSolid)" />
  <rect x="828" y="150" width="236" height="30" fill="#0b1220" />
  <text x="945" y="169" fill="#cdd7ea" font-size="12" text-anchor="middle">가장 유사한 예문을 프롬프트에 삽입</text>

  <!-- GPT -> 사용자 (loop back) -->
  <line x1="1240" y1="180" x2="1290" y2="180" stroke="#8fa3c4" stroke-width="2" />
  <line x1="1290" y1="180" x2="1290" y2="672" stroke="#8fa3c4" stroke-width="2" />
  <line x1="1290" y1="672" x2="192" y2="672" stroke="#8fa3c4" stroke-width="2" />
  <line x1="192" y1="672" x2="192" y2="558" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowSolid)" />
  <rect x="595" y="657" width="210" height="30" fill="#0b1220" />
  <text x="700" y="676" fill="#cdd7ea" font-size="12" text-anchor="middle">톤에 맞춰 생성된 마케팅 글 반환</text>

  <!-- 검증 note -->
  <rect x="840" y="470" width="330" height="100" rx="12" fill="#132018" stroke="#1fbf9b" stroke-width="1" stroke-dasharray="4 3" />
  <text x="862" y="498" fill="#7fe0c7" font-size="13" font-weight="700">검증 (예문 3개로 테스트)</text>
  <text x="862" y="520" fill="#cdeee3" font-size="12">관련 있는 예문의 유사도: 0.33</text>
  <text x="862" y="540" fill="#cdeee3" font-size="12">무관한 예문의 유사도: 0.19 ~ 0.24</text>
  <text x="862" y="560" fill="#cdeee3" font-size="12">→ 두 그룹이 뚜렷이 구분됨</text>
</svg>
