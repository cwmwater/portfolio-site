<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 480" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="arrowSolid3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8fa3c4" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="480" fill="#0b1220" />
  <text x="40" y="40" fill="#f6f4ef" font-size="20" font-weight="700">마케튼 글 생성 흐름 — 주제 설정 → 초안 생성 → 글 복사</text>

  <!-- ===== Top row: 3 UI 단계 ===== -->
  <!-- 1. 주제 설정 -->
  <rect x="50" y="90" width="260" height="80" rx="10" fill="#101a2c" stroke="#9dbee0" stroke-width="2" />
  <text x="66" y="112" fill="#e8b978" font-size="11" font-weight="700">1</text>
  <text x="180" y="140" fill="#f6f4ef" font-size="15" font-weight="700" text-anchor="middle">주제 설정</text>
  <text x="180" y="158" fill="#8fa3c4" font-size="11" text-anchor="middle">키워드 분석</text>

  <!-- 2. 초안 생성 -->
  <rect x="420" y="90" width="620" height="80" rx="10" fill="#101a2c" stroke="#9dbee0" stroke-width="2" />
  <text x="436" y="112" fill="#e8b978" font-size="11" font-weight="700">2</text>
  <text x="730" y="140" fill="#f6f4ef" font-size="15" font-weight="700" text-anchor="middle">초안 생성</text>
  <text x="730" y="158" fill="#8fa3c4" font-size="11" text-anchor="middle">본문 생성 · 제목 키워드 분석 · 제목 생성 (한 화면에서 순서대로)</text>

  <!-- 3. 글 복사 -->
  <rect x="1150" y="90" width="260" height="80" rx="10" fill="#101a2c" stroke="#9dbee0" stroke-width="2" />
  <text x="1166" y="112" fill="#e8b978" font-size="11" font-weight="700">3</text>
  <text x="1280" y="140" fill="#f6f4ef" font-size="15" font-weight="700" text-anchor="middle">글 복사</text>
  <text x="1280" y="158" fill="#8fa3c4" font-size="11" text-anchor="middle">최종 검토 (AI 호출 없음)</text>

  <!-- 상단 화살표 (라벨은 선 위쪽에 띄워서 겹치지 않게) -->
  <line x1="310" y1="130" x2="420" y2="130" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowSolid3)" />
  <text x="365" y="113" fill="#cdd7ea" font-size="12" text-anchor="middle">키워드</text>

  <line x1="1040" y1="130" x2="1150" y2="130" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowSolid3)" />
  <text x="1095" y="113" fill="#cdd7ea" font-size="12" text-anchor="middle">완성된 글</text>

  <!-- ===== 초안 생성 내부 처리 ===== -->
  <rect x="415" y="210" width="630" height="175" rx="12" fill="none" stroke="#1fbf9b" stroke-width="1" stroke-dasharray="4 3" />
  <text x="431" y="232" fill="#7fe0c7" font-size="12" font-weight="700">초안 생성 내부 처리 — 한 화면에서 순서대로 진행</text>

  <rect x="425" y="255" width="170" height="75" rx="8" fill="#101a2c" stroke="#9dbee0" stroke-width="2" />
  <text x="510" y="288" fill="#f6f4ef" font-size="13" font-weight="700" text-anchor="middle">본문 생성</text>
  <text x="510" y="308" fill="#8fa3c4" font-size="10" text-anchor="middle">소주제→본문 2회 호출</text>

  <line x1="595" y1="292" x2="645" y2="292" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowSolid3)" />
  <text x="620" y="277" fill="#cdd7ea" font-size="11" text-anchor="middle">본문</text>

  <rect x="645" y="255" width="170" height="75" rx="8" fill="#101a2c" stroke="#9dbee0" stroke-width="2" />
  <text x="730" y="288" fill="#f6f4ef" font-size="13" font-weight="700" text-anchor="middle">제목 키워드 분석</text>
  <text x="730" y="308" fill="#8fa3c4" font-size="10" text-anchor="middle">편집 중인 본문 분석</text>

  <line x1="815" y1="292" x2="865" y2="292" stroke="#8fa3c4" stroke-width="2" marker-end="url(#arrowSolid3)" />
  <text x="840" y="277" fill="#cdd7ea" font-size="11" text-anchor="middle">키워드</text>

  <rect x="865" y="255" width="170" height="75" rx="8" fill="#101a2c" stroke="#9dbee0" stroke-width="2" />
  <text x="950" y="288" fill="#f6f4ef" font-size="13" font-weight="700" text-anchor="middle">제목 생성</text>
  <text x="950" y="308" fill="#8fa3c4" font-size="10" text-anchor="middle">키워드+본문 결합</text>

  <!-- ===== 저장 note ===== -->
  <rect x="415" y="405" width="630" height="55" rx="10" fill="#1f1608" stroke="#d98e4c" stroke-width="1" stroke-dasharray="4 3" />
  <text x="435" y="438" fill="#e8b978" font-size="12">각 AI 호출이 끝나는 즉시 임시 저장글에 반영 — 중단돼도 이전 결과는 유지</text>
</svg>
