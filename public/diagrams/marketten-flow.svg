<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="arrowTeal4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1fbf9b" />
    </marker>
    <marker id="arrowSlate4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="460" fill="#0b1220" />
  <text x="30" y="34" fill="#f6f4ef" font-size="18" font-weight="700">단계별 글 생성 플로우 — 임시저장/최종본 동시 동기화 + 보관함 재개</text>

  <!-- Step row -->
  <rect x="30" y="50" width="220" height="70" rx="14" fill="#123a30" stroke="#1fbf9b" stroke-width="1.5" />
  <text x="140" y="78" fill="#89c9b6" font-size="10" text-anchor="middle">1단계</text>
  <text x="140" y="98" fill="#e6fbf4" font-size="14" font-weight="700" text-anchor="middle">키워드 분석</text>

  <rect x="270" y="50" width="220" height="70" rx="14" fill="#123a30" stroke="#1fbf9b" stroke-width="1.5" />
  <text x="380" y="78" fill="#89c9b6" font-size="10" text-anchor="middle">2단계</text>
  <text x="380" y="98" fill="#e6fbf4" font-size="14" font-weight="700" text-anchor="middle">본문 생성</text>

  <rect x="510" y="50" width="220" height="70" rx="14" fill="#123a30" stroke="#1fbf9b" stroke-width="1.5" />
  <text x="620" y="78" fill="#89c9b6" font-size="10" text-anchor="middle">3단계</text>
  <text x="620" y="98" fill="#e6fbf4" font-size="14" font-weight="700" text-anchor="middle">제목 키워드 분석</text>

  <rect x="750" y="50" width="220" height="70" rx="14" fill="#123a30" stroke="#1fbf9b" stroke-width="1.5" />
  <text x="860" y="78" fill="#89c9b6" font-size="10" text-anchor="middle">4단계</text>
  <text x="860" y="98" fill="#e6fbf4" font-size="14" font-weight="700" text-anchor="middle">제목 생성</text>

  <line x1="250" y1="85" x2="268" y2="85" stroke="#1fbf9b" stroke-width="2" marker-end="url(#arrowTeal4)" />
  <line x1="490" y1="85" x2="508" y2="85" stroke="#1fbf9b" stroke-width="2" marker-end="url(#arrowTeal4)" />
  <line x1="730" y1="85" x2="748" y2="85" stroke="#1fbf9b" stroke-width="2" marker-end="url(#arrowTeal4)" />

  <!-- Down to dual write -->
  <line x1="520" y1="120" x2="520" y2="158" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowSlate4)" />
  <text x="575" y="143" fill="#9aa4b5" font-size="10" text-anchor="middle">매 액션마다</text>

  <!-- Dual write: TempPost / FinalPost -->
  <rect x="310" y="160" width="200" height="70" rx="12" fill="#241a33" stroke="#a78bda" stroke-width="1.5" />
  <text x="410" y="192" fill="#d9c9f0" font-size="13" font-weight="700" text-anchor="middle">TempPost (임시저장)</text>
  <text x="410" y="210" fill="#c3aee0" font-size="10" text-anchor="middle">입력값·결과·step 기록</text>

  <rect x="530" y="160" width="200" height="70" rx="12" fill="#241a33" stroke="#a78bda" stroke-width="1.5" />
  <text x="630" y="192" fill="#d9c9f0" font-size="13" font-weight="700" text-anchor="middle">FinalPost (최종본)</text>
  <text x="630" y="210" fill="#c3aee0" font-size="10" text-anchor="middle">동시 갱신 · 항상 최신 유지</text>

  <line x1="510" y1="195" x2="528" y2="195" stroke="#a78bda" stroke-width="2" marker-end="url(#arrowTeal4)" />

  <!-- Down to 보관함 -->
  <line x1="520" y1="230" x2="520" y2="268" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowSlate4)" />
  <text x="558" y="253" fill="#9aa4b5" font-size="10" text-anchor="middle">조회</text>

  <rect x="390" y="270" width="260" height="70" rx="14" fill="#12233d" stroke="#6f93c4" stroke-width="1.5" />
  <text x="520" y="302" fill="#9dbee0" font-size="14" font-weight="700" text-anchor="middle">보관함 페이지</text>
  <text x="520" y="320" fill="#c9d6e8" font-size="10" text-anchor="middle">진행 중인 글 목록</text>

  <!-- Down to resume callout -->
  <line x1="520" y1="340" x2="520" y2="378" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowSlate4)" />
  <text x="558" y="363" fill="#9aa4b5" font-size="10" text-anchor="middle">선택</text>

  <rect x="280" y="380" width="480" height="70" rx="14" fill="#101a2c" stroke="#2a3b57" stroke-width="1" />
  <text x="520" y="410" fill="#f6f4ef" font-size="13" font-weight="700" text-anchor="middle">이어서 작성</text>
  <text x="520" y="430" fill="#c9d6e8" font-size="11" text-anchor="middle">저장된 step 그대로 복귀해 이어서 작성</text>
</svg>
