<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" font-family="'Pretendard', -apple-system, sans-serif">
  <defs>
    <marker id="bragArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8fa3c4" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="560" fill="#0b1220" />
  <text x="40" y="40" fill="#f6f4ef" font-size="20" font-weight="700">말씀결 이름 생성 파이프라인 — 구절 검색부터 근거 등급 판정까지</text>

  <!-- ===== 4 stage boxes ===== -->
  <!-- 1. 의미 문장 입력 -->
  <rect x="50" y="100" width="300" height="90" rx="10" fill="#101a2c" stroke="#9dbee0" stroke-width="2" />
  <text x="200" y="140" fill="#f6f4ef" font-size="15" font-weight="700" text-anchor="middle">의미 문장 입력</text>
  <text x="200" y="160" fill="#8fa3c4" font-size="11" text-anchor="middle">사용자가 원하는 뜻을 문장으로 작성</text>

  <!-- 2. 성경 구절 검색 -->
  <rect x="420" y="100" width="300" height="90" rx="10" fill="#101a2c" stroke="#7fe0c7" stroke-width="2" />
  <text x="570" y="140" fill="#f6f4ef" font-size="15" font-weight="700" text-anchor="middle">성경 구절 검색</text>
  <text x="570" y="160" fill="#7fe0c7" font-size="11" text-anchor="middle">문장에서 핵심 개념을 뽑아 구절 검색</text>

  <!-- 3. AI 이름 생성 -->
  <rect x="790" y="100" width="300" height="90" rx="10" fill="#101a2c" stroke="#e8b978" stroke-width="2" />
  <text x="940" y="140" fill="#f6f4ef" font-size="15" font-weight="700" text-anchor="middle">AI 이름 생성</text>
  <text x="940" y="160" fill="#e8b978" font-size="11" text-anchor="middle">검색된 구절만 후보로 받아 생성</text>

  <!-- 4. 근거 등급 판정 -->
  <rect x="1160" y="100" width="290" height="90" rx="10" fill="#101a2c" stroke="#9dbee0" stroke-width="2" />
  <text x="1305" y="140" fill="#f6f4ef" font-size="15" font-weight="700" text-anchor="middle">근거 등급 판정</text>
  <text x="1305" y="160" fill="#8fa3c4" font-size="11" text-anchor="middle">성경 데이터에서 다시 검색해 확인</text>

  <!-- Arrows -->
  <line x1="350" y1="145" x2="420" y2="145" stroke="#8fa3c4" stroke-width="2" marker-end="url(#bragArrow)" />
  <text x="385" y="128" fill="#cdd7ea" font-size="11" text-anchor="middle">핵심 개념</text>

  <line x1="720" y1="145" x2="790" y2="145" stroke="#8fa3c4" stroke-width="2" marker-end="url(#bragArrow)" />
  <text x="755" y="128" fill="#cdd7ea" font-size="11" text-anchor="middle">검색된 구절</text>

  <line x1="1090" y1="145" x2="1160" y2="145" stroke="#8fa3c4" stroke-width="2" marker-end="url(#bragArrow)" />
  <text x="1125" y="128" fill="#cdd7ea" font-size="11" text-anchor="middle">생성된 이름</text>

  <!-- 검색 밖 구절 필터링 note (아래로 이어지는 화살표) -->
  <line x1="940" y1="190" x2="940" y2="240" stroke="#8fa3c4" stroke-width="2" stroke-dasharray="4 3" />
  <rect x="700" y="240" width="480" height="70" rx="12" fill="#1f1608" stroke="#d98e4c" stroke-width="1" stroke-dasharray="4 3" />
  <text x="720" y="266" fill="#e8b978" font-size="12" font-weight="700">검색 범위 밖 구절 참조 시</text>
  <text x="720" y="286" fill="#f0d9b8" font-size="12">실제로 존재하는 구절이라도 근거로 인정하지 않고 걸러냄</text>

  <!-- ===== 근거 등급 4단계 (범례) ===== -->
  <rect x="150" y="360" width="1200" height="150" rx="14" fill="#0f1729" stroke="#475569" stroke-width="1.5" />
  <text x="175" y="392" fill="#f6f4ef" font-size="14" font-weight="700">근거 등급 4단계 — 생성된 이름을 성경 데이터에서 다시 검색해 판정</text>

  <rect x="185" y="415" width="260" height="70" rx="10" fill="#123a30" stroke="#7fe0c7" stroke-width="1.5" />
  <text x="315" y="445" fill="#7fe0c7" font-size="13" font-weight="700" text-anchor="middle">성경 직접 인용</text>
  <text x="315" y="465" fill="#cdeee3" font-size="10" text-anchor="middle">성경에 실제로 나오는 이름</text>

  <rect x="470" y="415" width="260" height="70" rx="10" fill="#132a40" stroke="#9dbee0" stroke-width="1.5" />
  <text x="600" y="445" fill="#9dbee0" font-size="13" font-weight="700" text-anchor="middle">성경적 개념</text>
  <text x="600" y="465" fill="#c9d6e8" font-size="10" text-anchor="middle">성경 속 개념으로 만든 이름</text>

  <rect x="755" y="415" width="260" height="70" rx="10" fill="#4a3218" stroke="#e8b978" stroke-width="1.5" />
  <text x="885" y="445" fill="#e8b978" font-size="13" font-weight="700" text-anchor="middle">해석 기반</text>
  <text x="885" y="465" fill="#f0d9b8" font-size="10" text-anchor="middle">해석을 더해 만든 이름</text>

  <rect x="1040" y="415" width="260" height="70" rx="10" fill="#241a2e" stroke="#c9a0e0" stroke-width="1.5" />
  <text x="1170" y="445" fill="#c9a0e0" font-size="13" font-weight="700" text-anchor="middle">창작</text>
  <text x="1170" y="465" fill="#ddc7ec" font-size="10" text-anchor="middle">새로 지은 이름</text>
</svg>
